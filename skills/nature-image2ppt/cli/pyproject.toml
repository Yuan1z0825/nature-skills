[project]
name = "image2ppt-cli"
version = "1.1.0"
description = "Self-contained image2ppt CLI for the image2ppt skill."
requires-python = ">=3.10"
dependencies = [
  "pypdfium2>=4.30.0",
  "Pillow>=10.0.0",
  "openai>=2.0.0",
  "PyYAML>=6.0.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
]

[project.scripts]
image2ppt = "image2ppt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image2ppt"]

[tool.hatch.build]
exclude = [
  "**/.DS_Store",
  "**/__pycache__",
]
