name: Validate skill index

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README_EN.md'
      - 'scripts/validate-skill-index.py'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README_EN.md'
      - 'scripts/validate-skill-index.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skill-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Run skill index validator
        run: python scripts/validate-skill-index.py
