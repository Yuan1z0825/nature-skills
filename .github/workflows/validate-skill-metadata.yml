name: Validate skill metadata

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README_EN.md'
      - '.github/requirements-ci.txt'
      - 'scripts/validate-skill-metadata.py'
      - 'scripts/tests/test_validate_skill_metadata.py'
  push:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'README_EN.md'
      - '.github/requirements-ci.txt'
      - 'scripts/validate-skill-metadata.py'
      - 'scripts/tests/test_validate_skill_metadata.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skill-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install -c .github/requirements-ci.txt pyyaml

      - name: Run metadata validator
        run: python scripts/validate-skill-metadata.py

      - name: Run metadata validator regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_validate_skill_metadata.py'
