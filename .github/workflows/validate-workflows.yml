name: Validate workflow path filters

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/requirements-ci.txt'
      - 'scripts/validate-workflows.py'
      - 'scripts/tests/test_validate_workflows.py'
  push:
    paths:
      - '.github/workflows/**'
      - '.github/requirements-ci.txt'
      - 'scripts/validate-workflows.py'
      - 'scripts/tests/test_validate_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install -c .github/requirements-ci.txt pyyaml

      - name: Run workflow validator
        run: |
          python -m unittest scripts/tests/test_validate_workflows.py
          python scripts/validate-workflows.py
